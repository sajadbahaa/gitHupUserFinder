<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHup userFinder</title>
    <!-- notmalize.css -->
     <link rel="stylesheet" href="/src/css/normalize.css">
    <!-- style.css -->
     <link rel="stylesheet" href="/src/css/style.css"> 
    <!-- font-awosome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<script type="module" src="/src/js/app.js" defer ></script>
</head>
<body>
     <div class="container flex">
    <header class="header">
        <h1 class="heder-title" ><i class="custom-i fa-brands fa-github"></i> GitHup User Finder</h1>
    <p class="label">Search for any GitHub user to see profile and repositories</p> 
    </header>  
     <main >
    <form id = "form-id" class="search flex">
        <input id="input-search" class="input-search" aria-label="Search GitHub username" type="text" placeholder="search..." required>
        <button type="submit" id= "btn-search" class="btn btn-search">Search</button>
    </form>
     <section  class="user-card flex">
<section class="user-info grid">
  <div class="user-avator inline-flex">
         <img id="img-profile" class="avator"  alt="prfile" loading="lazy">
     <span class="avatar-fallback hide">Not found</span>
        </div>
      <div class="user-details flex">
        <h2 id="name" class="user-name">Burak</h2>
        <p  id="username" class="user-username">@burakorkmez</p>
        <p  id="user-bio" class="user-bio">formerly As a Programmer</p>
        <div class="user-meta inline-flex">
          <span id="location"><i class="custom-i fa-solid fa-location-dot"></i> Not specified</span>
          <span  id="joined"><i class="custom-i fa-regular fa-calendar-days"></i> Joined Dec 1, 2020</span>
        </div>
        <a href="#" class="btn view-profile">View Profile</a>
        </div>
    </section>
    <section class="stats grid">
    <div class="item flex">
        <i class="custom-i fa-solid fa-users"></i>
        <span id="followers" class="label">2075 follwers</span>
    </div>
    <div class="item flex">
        <i class="custom-i fa-solid fa-user-group"></i>
        <span id="following" class="label">22 following</span>
    </div>
    <div class="item flex">
        <i class="custom-i fa-solid fa-code-branch"></i>
        <span id="count-repo" class="label">40 repositories</span>
    </div>
    </section><hr>
    <section class="social grid">
    <div class="item flex">
        <i class="custom-i fa-solid fa-building"></i>
        <span id="company" class="label">not specified</span>
    </div>
    <div class="item flex">
        <i class="custom-i fa-solid fa-link"></i>
        <span id="link" class="label">link</span>
    </div>
    <div class="item flex">
        <i class="custom-i fa-brands fa-twitter"></i>
        <span id="twiter" class="label">twiter account</span>
    </div>
    </section>
<section id="repos" class="repos">
<header class="header-repo">
<h2 class="title">Last Repositories</h2>
</header>
<hr>
</section>
     </section>
     </main>
     </div>
</body>
</html>
